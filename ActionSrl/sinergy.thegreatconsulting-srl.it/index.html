<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sito in manutenzione</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 560px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 16px; font-weight: 600; }
    p { font-size: 17px; line-height: 1.6; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">&#128736;</div>
    <h1>Sito in manutenzione</h1>
    <p>Il sito &egrave; temporaneamente in manutenzione. Torneremo presto online. Grazie per la pazienza.</p>
  </div>
</body>
</html>
