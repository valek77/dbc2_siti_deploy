<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sito in arrivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
    p { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      margin: 28px 4px 0;
      border-radius: 50%;
      background: #fff;
      opacity: 0.5;
      animation: pulse 1.4s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Stiamo arrivando</h1>
    <p>Il nostro sito &egrave; in fase di aggiornamento. Torneremo online a breve.</p>
    <div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
</body>
</html>
