<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sito in manutenzione</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 560px; }
    .icon {
      width: 88px; height: 88px;
      margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .icon svg { width: 42px; height: 42px; stroke: #38bdf8; }
    h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; margin-bottom: 16px; letter-spacing: -0.02em; }
    p { font-size: 17px; line-height: 1.7; color: #94a3b8; margin-bottom: 10px; }
    .hint { margin-top: 28px; font-size: 14px; color: #64748b; }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2 2.6-2.6z" />
      </svg>
    </div>
    <h1>Sito in manutenzione</h1>
    <p>Stiamo effettuando alcuni interventi tecnici per migliorare il servizio.</p>
    <p>Il sito tornerà disponibile a breve. Grazie per la pazienza.</p>
    <div class="hint">Torna a trovarci tra poco.</div>
  </div>
</body>

</html>
